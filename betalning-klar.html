<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Betalning mottagen — LAUNCH UF</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,460&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .status-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .status-icon{width:64px;height:64px;border-radius:50%;background:var(--gold);color:#0a0a0a;display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin-bottom:24px}
  .status-page h1{font-family:var(--serif);font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:14px}
  .status-page p{color:var(--ink-dim);max-width:46ch;margin-bottom:30px}
</style>
</head>
<body>
<div class="status-page">
  <div class="status-icon">✓</div>
  <h1>Betalningen är mottagen.</h1>
  <p id="msg">Tack! Er beställning är nu betald och vi börjar jobba på er hemsida. En bekräftelse skickas till er e-post inom kort.</p>
  <a class="button button-primary" href="/">Till startsidan</a>
</div>
<script>
  const p = new URLSearchParams(location.search);
  const order = p.get('order');
  if (order) document.getElementById('msg').textContent = `Tack! Beställning ${order} är nu betald och vi börjar jobba på er hemsida.`;
</script>
</body>
</html>
