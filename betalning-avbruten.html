<!doctype html>
<html lang="sv">
<head>

<title>Betalning avbruten — LAUNCH UF</title>

<style>
  .status-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}

  .status-page h1{font-family:var(--serif);font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:14px}
  .status-page p{color:var(--ink-dim);max-width:46ch;margin-bottom:30px}
</style>
</head>
<body>
<div class="status-page">
  <div class="status-icon">×</div>
  <h1>Betalningen avbröts.</h1>
  <p>Ingen betalning har dragits. Er beställning finns kvar — ni kan gärna försöka igen, eller kontakta oss om något krånglade.</p>
  <a class="button button-primary" href="/">Till startsidan</a>
</div>
</body>
